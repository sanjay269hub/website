<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Login | Manning's School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="box header-box">
      <a href="index.html" class="logo">
        <img src="images/Mannings-School-Insignia.webp" alt="School crest">
        <span>Manning's School</span>
      </a>
      <button type="button" id="menu-button" aria-controls="main-nav" aria-expanded="false">Menu</button>
      <nav id="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact Us</a></li>
          <li><a href="login.html" class="active" aria-current="page">Portal Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <!-- login.js validates credentials through ManningAuth and displays failures here. -->
    <section class="box login-card" aria-labelledby="login-heading">
      <h1 id="login-heading">School Portal Login</h1>
      <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="button">Sign In</button>
      </form>

      <!-- Coursework-only demo credentials; they are not server-side accounts. -->
      <details class="demo-accounts">
        <summary>Demo Accounts</summary>
        <p>Administrator: <code>admin</code> / <code>admin123</code></p>
        <p>Teacher: <code>teacher</code> / <code>teacher123</code></p>
        <p>Read-only Viewer: <code>viewer</code> / <code>viewer123</code></p>
      </details>
    </section>
  </main>

  <footer>
    <p>Manning's School | Savanna-la-mar, Westmoreland</p>
  </footer>

  <script src="js/index.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
