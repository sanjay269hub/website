<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title> Contact Us | Manning's School</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<header>
			<div class="box header-box">
				<a href="index.html" class="logo">
					<img src="images/Mannings-School-Insignia.webp" alt="School crest">
					<span> Manning's School</span>
				</a>
				<button type="button" id="menu-button" aria-controls="main-nav" aria-expanded="false">Menu</button>
				<nav id="main-nav" aria-label="Main navigation">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="about.html">About Us</a></li>
						<li><a href="contact.html" class="active" aria-current="page">Contact Us</a></li>
						<li><a href="login.html">Portal Login</a></li>
					</ul>
				</nav>
			</div>
		</header>
		<main>
			<section class="section">
				<div class="box">
					<h1> Contact Us</h1>
					
					<form id="contactus-form" class="contact-form">
						<div class="contact-field">
							<label for="fullname">Full Name</label>
							<input type="text" id="fullname" name="fullname" autocomplete="name" minlength="2" maxlength="100" required>
						</div>
						<div class="contact-field">
							<label for="email">Email Address</label>
							<input type="email" id="email" name="email" autocomplete="email" maxlength="254" required placeholder="Please enter your email">
						</div>
						<div class="contact-field">
							<label for="phone">Phone Number (optional)</label>
							<input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="20" placeholder="876-555-0123">
						</div>
						<div class="contact-field">
							<label for="topic">Topic</label>
							<select id="topic" name="topic" required>
								<option value="">Choose a topic</option>
								<option value="Admission">Admission</option>
								<option value="Academic Record">Academic Record</option>
								<option value="General Enquiry">General Enquiry</option>
								<option value="Fees &amp; Payment">Fees &amp; Payment</option>
							</select>
						</div>
						<div class="contact-field">
							<label for="message">Message</label>
							<textarea id="message" name="message" rows="5" minlength="15" maxlength="500" required></textarea>
							<p class="contact-help">Message must be between 15 and 500 characters.</p>
						</div>
						<button type="submit" class="button">Send Message</button>
						<p id="contact-message" class="contact-message" role="status" aria-live="polite"></p>
					</form>
				</div>
			</section>
		</main>
		
		<footer>
			<p> Manning's School | Savanna-la-mar, Westmoreland</p>
		</footer>
		
		<script src="js/index.js"></script>
		<script src="js/contact.js"></script>
	</body>
</html>
